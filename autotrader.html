<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autotrader Search Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #6b7280;
      font-size: 1.1rem;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .section-label {
      font-weight: 600;
      font-size: 1.1rem;
      color: #374151;
      margin-bottom: 0.75rem;
      display: block;
    }

    .search-input-container {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 400;
      background: white;
      color: #374151;
      transition: all 0.3s ease;
      outline: none;
    }

    .search-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .search-input::placeholder {
      color: #9ca3af;
    }

.dropdown-suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: white;
  border: 2px solid #e5e7eb;
  border-top: none;
  border-radius: 0 0 16px 16px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 1000;
  display: none;
  pointer-events: none; /* 👈 önemli: tıklanamaz hale getir */
  opacity: 0;            /* 👈 görünmez ve yer kaplamaz */
  transform: translateY(-8px); /* opsiyonel animasyon */
  transition: all 0.2s ease;
}
#brandSuggestions:empty {
  display: none !important;
}
    .dropdown-suggestion {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-bottom: 1px solid #f3f4f6;
      transition: background-color 0.2s ease;
    }

    .dropdown-suggestion:hover,
    .dropdown-suggestion.highlighted {
      background-color: #f8fafc;
    }

    .dropdown-suggestion:last-child {
      border-bottom: none;
    }

    .scrolling-options, .year-grid {
      display: flex;
      overflow-x: auto;
      gap: 0.75rem;
      padding: 0.5rem 0;
      scrollbar-width: thin;
      scrollbar-color: #d1d5db #f9fafb;
      flex-wrap: wrap;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.75rem;
      max-width: 100%;
      overflow-x: visible;
      flex-wrap: unset;
    }

    @media (max-width: 768px) {
      .year-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
      }
    }

    .scrolling-options::-webkit-scrollbar {
      height: 6px;
    }

    .scrolling-options::-webkit-scrollbar-track {
      background: #f9fafb;
      border-radius: 3px;
    }

    .scrolling-options::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }

    .option-btn {
      white-space: nowrap;
      padding: 0.75rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: white;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      min-width: fit-content;
      flex-shrink: 0;
    }

    .option-btn:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
    }

    .option-btn.selected {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 1.25rem 2rem;
      border: none;
      border-radius: 16px;
      width: 100%;
      margin-top: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:active {
      transform: translateY(-1px);
    }

.grid-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  align-items: flex-start; /* içerikleri yukardan hizala */
}
.form-group {
  flex: 1 1 300px; /* min 300px genişlikte, eşit büyüme */
}
#mileageOptions {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 0.5rem;
  max-height: 200px;
  overflow-y: auto;
}
    @media (max-width: 768px) {
      .card {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }

      .header h1 {
        font-size: 2rem;
      }

      .grid-layout {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .scrolling-options {
        gap: 0.5rem;
      }

      .option-btn {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }

    .highlight-match {
      background-color: #fef3c7;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>🚗 AutoTrader</h1>
        <p>Find your perfect car with advanced search</p>
      </div>

      <div class="form-group">
        <label class="section-label">📍 ZIP Code</label>
        <input type="text" id="zipInput" class="search-input" value="02072" placeholder="Enter ZIP code">
      </div>

      <div class="grid-layout">
        <div class="form-group">
          <label class="section-label">📅 Select Year</label>
          <div class="year-grid" id="yearOptions"></div>
        </div>

        <div class="form-group">
          <label class="section-label">🛣️ Select Mileage</label>
          <div class="scrolling-options" id="mileageOptions"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">📍 Select Distance</label>
        <div class="scrolling-options" id="radiusOptions"></div>
      </div>

      <div class="form-group">
        <label class="section-label">💰 Select Deal Type</label>
        <div class="scrolling-options" id="dealTypeOptions"></div>
      </div>

      <div class="grid-layout">
        <div class="form-group">
          <label class="section-label">🏭 Enter Brand</label>
          <div class="search-input-container">
            <input type="text" id="brandInput" class="search-input" placeholder="e.g. Toyota, Honda, Ford..." autocomplete="off">
            <div id="brandSuggestions" class="dropdown-suggestions"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="section-label">🚙 Search Model</label>
          <div class="search-input-container">
            <input type="text" id="modelSearch" class="search-input" placeholder="e.g. Camry, Accord, F-150..." autocomplete="off">
            <div id="modelSuggestions" class="dropdown-suggestions"></div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">⚡ Trim (optional)</label>
        <input type="text" id="trimInput" class="search-input" placeholder="e.g. LE, XLE, SE, Limited...">
      </div>

      <div class="form-group">
        <label class="section-label">🔍 Keywords (optional)</label>
        <input type="text" id="keywordInput" class="search-input" placeholder="e.g. leather, sunroof, navigation, harman...">
      </div>

      <button id="searchBtn" class="submit-btn">🔍 Search Cars</button>
    </div>
  </div>

  <script>
    // Generate years from 2010 to 2025
    const years = [];
    for (let year = 2010; year <= 2025; year++) {
      years.push(year);
    }

    // Generate mileages from 50k to 200k in 5k increments
    const mileages = [];
    for (let mileage = 50; mileage <= 200; mileage += 5) {
      mileages.push(mileage);
    }

    const radii = [25, 50, 100, 200, 500, 'Nationwide'];
    const dealTypes = ['Good Price', 'Great Price'];

    function fillOptions(arr, targetId) {
      const el = document.getElementById(targetId);
      arr.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        if (targetId === 'mileageOptions') {
          btn.innerText = val + 'k';
          btn.dataset.value = val;
        } else if (targetId === 'radiusOptions') {
          btn.innerText = val === 'Nationwide' ? val : val;
          btn.dataset.value = val === 'Nationwide' ? '0' : val;
        } else if (targetId === 'dealTypeOptions') {
          btn.innerText = val;
          btn.dataset.value = val.toLowerCase().replace(' ', '');
        } else {
          btn.innerText = val;
          btn.dataset.value = val;
        }
        
        btn.onclick = () => {
          [...el.children].forEach(c => c.classList.remove('selected'));
          btn.classList.add('selected');
        };
        el.appendChild(btn);
      });
    }

    fillOptions(years, 'yearOptions');
    fillOptions(mileages, 'mileageOptions');
    fillOptions(radii, 'radiusOptions');
    fillOptions(dealTypes, 'dealTypeOptions');

    const brandInput = document.getElementById('brandInput');
    const modelInput = document.getElementById('modelSearch');
    const trimInput = document.getElementById('trimInput');
    const keywordInput = document.getElementById('keywordInput');
    const zipInput = document.getElementById('zipInput');
    const brandSuggestions = document.getElementById('brandSuggestions');
    const modelSuggestions = document.getElementById('modelSuggestions');

    const brandModelData = JSON.parse(document.getElementById('brandModelData').textContent);
    const zipCodeData = JSON.parse(document.getElementById('zipCodeData').textContent);

    let currentBrandIndex = -1;
    let currentModelIndex = -1;

    function highlightText(text, query) {
      if (!query) return text;
      const regex = new RegExp(`(${query})`, 'gi');
      return text.replace(regex, '<span class="highlight-match">$1</span>');
    }

    function showSuggestions(input, suggestions, data, isModel = false) {
      const query = input.value.trim().toLowerCase();
      suggestions.innerHTML = '';
      
      if (!query) {
        suggestions.style.display = 'none';
        return;
      }

      let matches = [];
      if (isModel) {
        const selectedBrand = brandInput.value.trim();
        if (brandModelData[selectedBrand]) {
          matches = brandModelData[selectedBrand].filter(model => 
            model.toLowerCase().includes(query)
          );
        }
      } else {
        matches = Object.keys(data).filter(brand => 
          brand.toLowerCase().includes(query)
        );
      }

      if (matches.length > 0) {
        matches.forEach((match, index) => {
          const div = document.createElement('div');
          div.className = 'dropdown-suggestion';
          div.innerHTML = highlightText(match, query);
          div.onclick = () => {
            input.value = match;
            suggestions.style.display = 'none';
            if (!isModel) {
              modelInput.value = '';
              updateModelSuggestions();
            }
          };
          suggestions.appendChild(div);
        });
        
        suggestions.style.display = 'block';
            suggestions.style.pointerEvents = 'auto';
    suggestions.style.opacity = '1';
      } else {
        suggestions.style.display = 'none';
            suggestions.style.pointerEvents = 'none';
    suggestions.style.opacity = '0';
      }
    }

    function updateModelSuggestions() {
      const selectedBrand = brandInput.value.trim();
      if (brandModelData[selectedBrand]) {
        showSuggestions(modelInput, modelSuggestions, brandModelData[selectedBrand], true);
      } else {
        modelSuggestions.style.display = 'none';
      }
    }

    function handleKeyNavigation(event, suggestions, input, isModel = false) {
      const items = suggestions.querySelectorAll('.dropdown-suggestion');
      const currentIndex = isModel ? currentModelIndex : currentBrandIndex;
      
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        const newIndex = currentIndex < items.length - 1 ? currentIndex + 1 : 0;
        if (isModel) currentModelIndex = newIndex;
        else currentBrandIndex = newIndex;
        updateHighlight(items, newIndex);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        const newIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
        if (isModel) currentModelIndex = newIndex;
        else currentBrandIndex = newIndex;
        updateHighlight(items, newIndex);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (currentIndex >= 0 && items[currentIndex]) {
          input.value = items[currentIndex].textContent;
          suggestions.style.display = 'none';
          if (isModel) currentModelIndex = -1;
          else currentBrandIndex = -1;
        }
      }
    }

    function updateHighlight(items, index) {
      items.forEach((item, i) => {
        item.classList.toggle('highlighted', i === index);
      });
    }

    brandInput.addEventListener('input', () => {
      currentBrandIndex = -1;
      showSuggestions(brandInput, brandSuggestions, brandModelData);
      updateModelSuggestions();
    });

    brandInput.addEventListener('keydown', (e) => {
      handleKeyNavigation(e, brandSuggestions, brandInput);
    });

    modelInput.addEventListener('input', () => {
      currentModelIndex = -1;
      updateModelSuggestions();
    });

    modelInput.addEventListener('keydown', (e) => {
      handleKeyNavigation(e, modelSuggestions, modelInput, true);
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', (e) => {
      if (!brandInput.contains(e.target) && !brandSuggestions.contains(e.target)) {
        brandSuggestions.style.display = 'none';
        currentBrandIndex = -1;
      }
      if (!modelInput.contains(e.target) && !modelSuggestions.contains(e.target)) {
        modelSuggestions.style.display = 'none';
        currentModelIndex = -1;
      }
    });

    document.getElementById('searchBtn').onclick = () => {
      const year = document.querySelector('#yearOptions .selected')?.dataset.value;
      const mileageElement = document.querySelector('#mileageOptions .selected');
      const mileage = mileageElement ? parseInt(mileageElement.dataset.value) * 1000 : null;
      const radius = document.querySelector('#radiusOptions .selected')?.dataset.value;
      const dealType = document.querySelector('#dealTypeOptions .selected')?.dataset.value;
      const brand = brandInput.value.trim();
      const modelInputVal = modelInput.value.trim();
      const trimVal = trimInput.value.trim().toLowerCase();
      const keywordVal = keywordInput.value.trim();
      const zip = zipInput.value.trim();

      // Debug logging
      console.log('Form values:', {
        year, mileage, radius, dealType, brand, modelInputVal, zip, keywords: keywordVal
      });

      if (!year || !mileage || !radius || !dealType || !brand || !modelInputVal || !zip) {
        alert("Please fill out all required fields (ZIP Code, Year, Mileage, Distance, Deal Type, Brand, and Model).");
        return;
      }

      const cityState = zipCodeData[zip] || "stoughton-ma";
      const trimSegment = trimVal ? `/${trimVal}` : '';
      const searchRadius = radius === '0' ? '0' : radius;
      
      // Build URL with optional keyword parameter
      let url = `https://www.autotrader.com/cars-for-sale/all-cars/${year}/${brand.toLowerCase()}/${modelInputVal.toLowerCase().replaceAll(' ', '-')}${trimSegment}/${cityState}?dealType=${dealType}&mileage=${mileage}&searchRadius=${searchRadius}&sortBy=mileageDESC&zip=${zip}`;
      
      if (keywordVal) {
        url = `https://www.autotrader.com/cars-for-sale/all-cars/${cityState}?keywordPhrases=${encodeURIComponent(keywordVal)}&searchRadius=${searchRadius}&sortBy=mileageDESC&zip=${zip}`;
      }
      
      console.log('Generated URL:', url);
      window.open(url, '_blank');
    };

    // Auto-focus on first input
    document.addEventListener('DOMContentLoaded', () => {
      zipInput.focus();
    });
  </script>
</body>
</html>
